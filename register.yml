name: Register plate

on:
  workflow_dispatch:
    inputs:
      plate:
        description: Plate number
        required: true
      days:
        description: Number of days
        required: true
        default: "1"

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install selenium
      - name: Validate inputs
        env:
          PLATE: ${{ inputs.plate }}
          DAYS: ${{ inputs.days }}
        run: |
          [[ "$PLATE" =~ ^[A-Z0-9]{2,8}$ ]] || { echo "Bad plate"; exit 1; }
          [[ "$DAYS" =~ ^[0-9]{1,2}$ ]] || { echo "Bad days"; exit 1; }
      - name: Submit permit
        env:
          PPO_ID: ${{ secrets.PPO_ID }}
          CONFIRM_EMAIL: ${{ secrets.CONFIRM_EMAIL }}
          PLATE: ${{ inputs.plate }}
          DAYS: ${{ inputs.days }}
        run: python register.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: "*.png"
          if-no-files-found: ignore
